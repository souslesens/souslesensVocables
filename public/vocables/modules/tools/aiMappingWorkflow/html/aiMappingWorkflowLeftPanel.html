<style>
    #aiMappingWorkflow_leftPanel {
        flex: 1;
        overflow-y: auto;
        padding: 12px 10px 20px;
        font-family: Helvetica, sans-serif;
        color: #374649;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }
    .masterData-databaseBar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }
    .masterData-databaseName {
        font-size: 16px;
        font-weight: bold;
    }
    .masterData-databaseList {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .masterData-databaseList button {
        text-align: left;
    }
    /* one proposal of a card, its details folded under "More details" */
    .masterData-readingBox {
        background: #ffffff;
        border: 1px solid #c9d3d6;
        border-radius: 10px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .masterData-readingBox summary {
        cursor: pointer;
        color: #3557a8;
    }
    .masterData-panel {
        background: #e9eeef;
        border-radius: 14px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .masterData-legendLine {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .masterData-help {
        display: inline-block;
        width: 16px;
        height: 16px;
        line-height: 16px;
        text-align: center;
        border-radius: 50%;
        background: #d0d7de;
        font-size: 11px;
        cursor: help;
    }
    .masterData-optionChip {
        border: 1px solid #c9d3d6;
        background: #ffffff;
        border-radius: 12px;
        padding: 2px 10px;
        margin: 2px 4px 2px 0;
        cursor: pointer;
        text-align: left;
    }
    .masterData-optionChip:hover,
    .masterData-optionChipOpened {
        border-color: #3e3efc;
    }
    .masterData-optionChipUser {
        background: #eef0ff;
    }
    .masterData-optionChip:disabled {
        color: #7a8a8e;
        cursor: default;
    }
    .masterData-optionChooser {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 6px 0 10px;
    }
    .masterData-uriExample {
        font-family: monospace;
        font-size: 12px;
        word-break: break-all;
    }
    .masterData-uriBuilder {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
        font-family: monospace;
        font-size: 12px;
    }
    .masterData-uriBuilder input {
        border: none;
        border-radius: 14px;
        background: #ffffff;
        padding: 3px 8px;
        font-family: monospace;
        color: #3e3efc;
    }
    .masterData-uriBase {
        color: #7a8a8e;
    }
    .masterData-uriValue {
        border-radius: 3px;
        padding: 2px 6px;
        color: #3d2e00;
    }
    .masterData-tableTitle {
        font-weight: bold;
        color: #6f6f6f;
        padding-top: 6px;
    }
    .masterData-group {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }
    .masterData-groupTitle {
        display: flex;
        justify-content: space-between;
        font-weight: bold;
        border-bottom: 1px solid #d4dadc;
        padding-bottom: 2px;
    }
    .masterData-otherChoice {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 10px;
        border-radius: 14px;
        background: #ffffff;
    }
    .masterData-otherKind {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 8px;
        text-align: left;
        border: 1px solid #eef1f2;
        border-radius: 10px;
        background: #fbfcfc;
        padding: 4px 8px;
        cursor: pointer;
    }
    .masterData-hint {
        color: #7a8a8e;
        font-size: 12px;
    }
    /* what one row gives for a choice, under the choice */
    .masterData-example {
        color: #3557a8;
        font-size: 11px;
        font-style: italic;
        overflow-wrap: anywhere;
    }
    #aiMappingWorkflow_mappingList {
        padding: 16px;
        overflow: auto;
        height: 100%;
    }
    .masterData-mappingList {
        border-collapse: collapse;
    }
    .masterData-mappingList th,
    .masterData-mappingList td {
        padding: 6px 14px;
        text-align: left;
        border-bottom: 1px solid #e3e8ea;
    }
    .masterData-mappingList tr:hover td {
        background: #f2f7f9;
        cursor: pointer;
    }
    #aiMappingWorkflow_mappingBack {
        position: absolute;
        top: 10px;
        left: 10px;
    }
    .masterData-class {
        background: #00afef;
        color: #000000;
        padding: 3px 8px;
        border-radius: 3px;
        align-self: flex-start;
    }
    .masterData-column {
        color: #000000;
        padding: 3px 8px;
        border-radius: 3px;
    }
    .masterData-dashed {
        border-top: 2px dashed #00afef;
        width: 30px;
    }
    .masterData-fields td {
        padding: 2px 0 6px;
        line-height: 1.45;
        vertical-align: top;
    }
    .masterData-fields td.masterData-fieldName {
        color: #3e3efc;
        padding-right: 10px;
        white-space: nowrap;
    }
    .masterData-step {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: bold;
    }
    .masterData-stepNumber {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #3e3efc;
        color: #ffffff;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .masterData-stepContent {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .masterData-evidence {
        overflow-x: auto;
    }
    .masterData-evidenceTable {
        border-collapse: collapse;
        font-size: 12px;
        width: 100%;
        border: 1px solid #d4dadc;
    }
    .masterData-evidenceTable th {
        background: #e9eeef;
        color: #3e3efc;
        font-weight: normal;
        text-align: left;
        padding: 4px 8px;
    }
    .masterData-evidenceTable td {
        border-top: 1px solid #e3e8ea;
        padding: 3px 8px;
    }
    .masterData-option {
        display: flex;
        flex-direction: column;
        gap: 6px;
        text-align: left;
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid #d4dadc;
        background: #ffffff;
        cursor: pointer;
        font-family: Helvetica, sans-serif;
        font-size: 13px;
        color: #374649;
    }
    .masterData-option.masterData-selected {
        border: 2px solid #3e3efc;
        background: #eef0ff;
    }
    .masterData-optionTitle {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 14px;
        font-weight: bold;
    }
    .masterData-radio {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid #3e3efc;
        box-sizing: border-box;
        flex-shrink: 0;
        background: #ffffff;
    }
    .masterData-selected .masterData-radio {
        background: #3e3efc;
        box-shadow: inset 0 0 0 3px #ffffff;
    }
    .masterData-badge {
        font-size: 11px;
        font-weight: normal;
        color: #ffffff;
        background: #3e3efc;
        padding: 2px 8px;
        border-radius: 10px;
    }
    .masterData-probability {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: bold;
    }
    .masterData-probabilityBar {
        width: 90px;
        height: 6px;
        border-radius: 3px;
        background: #d4dadc;
        overflow: hidden;
    }
    .masterData-probabilityFill {
        height: 6px;
        background: #3e3efc;
    }
    .masterData-note {
        background: #f8f8f8;
        border: 1px dashed #b8c2c5;
        border-radius: 10px;
        padding: 8px 12px;
    }
    .masterData-footer {
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-top: 1px solid #d4dadc;
        padding-top: 12px;
    }
    .masterData-writtenLabel {
        color: #3e3efc;
        margin-right: 8px;
    }
    .masterData-applyButton {
        align-self: flex-end;
        font-size: 14px;
        font-weight: bold;
        border: none;
        border-radius: 14px;
        padding: 8px 24px;
        cursor: pointer;
        color: #ffffff;
        background: linear-gradient(to right, #009cea, #4139fd);
    }
    .masterData-applyButton:disabled {
        background: #b8c2c5;
        cursor: not-allowed;
    }
    /* Undo the choice beside Apply, at the end of the card */
    .masterData-footerButtons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
    }
    /* the tabs of the workflow steps, above the graph */
    .aiMappingWorkflow-tabs {
        display: flex;
        gap: 4px;
        padding: 6px 8px 0;
        border-bottom: 1px solid #d4dadc;
        font-family: Helvetica, sans-serif;
    }
    .aiMappingWorkflow-tab {
        border: 1px solid #d4dadc;
        border-bottom: none;
        border-radius: 10px 10px 0 0;
        padding: 5px 14px;
        background: #e9eeef;
        color: #374649;
        font-size: 13px;
        cursor: pointer;
    }
    .aiMappingWorkflow-tab.aiMappingWorkflow-selectedTab {
        background: #ffffff;
        color: #3e3efc;
        font-weight: bold;
    }
    .aiMappingWorkflow-tab:disabled {
        color: #b8c2c5;
        cursor: not-allowed;
    }
</style>
<div id="aiMappingWorkflow_leftPanel">
    <div class="masterData-databaseBar">
        <span class="masterData-databaseName" id="aiMappingWorkflow_databaseName"></span>
        <button class="slsv-button-1" id="aiMappingWorkflow_changeDatabaseButton">Change database</button>
        <button class="slsv-button-1" id="aiMappingWorkflow_deleteAllButton" title="Delete everything the AI found and decided on this database, and start again from scratch">Delete all</button>
    </div>
    <div class="masterData-databaseList" id="aiMappingWorkflow_databaseList"></div>
    <div id="aiMappingWorkflow_explanation"></div>
    <div id="aiMappingWorkflow_card"></div>
</div>
