<style>
    #aiMappingWorkflow_leftPanel {
        flex: 1;
        overflow-y: auto;
        padding: 12px 10px 20px;
        font-family: Helvetica, sans-serif;
        color: #374649;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }
    .masterData-databaseBar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }
    .masterData-databaseName {
        font-size: 16px;
        font-weight: bold;
    }
    .masterData-databaseList {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .masterData-databaseList button {
        text-align: left;
    }
    .masterData-panel {
        background: #e9eeef;
        border-radius: 14px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .masterData-legendLine {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .masterData-class {
        background: #00afef;
        color: #000000;
        padding: 3px 8px;
        border-radius: 3px;
        align-self: flex-start;
    }
    .masterData-column {
        color: #000000;
        padding: 3px 8px;
        border-radius: 3px;
    }
    .masterData-dashed {
        border-top: 2px dashed #00afef;
        width: 30px;
    }
    .masterData-fields td {
        padding: 2px 0 6px;
        line-height: 1.45;
        vertical-align: top;
    }
    .masterData-fields td.masterData-fieldName {
        color: #3e3efc;
        padding-right: 10px;
        white-space: nowrap;
    }
    .masterData-step {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: bold;
    }
    .masterData-stepNumber {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #3e3efc;
        color: #ffffff;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .masterData-stepContent {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .masterData-evidence {
        overflow-x: auto;
    }
    .masterData-evidenceTable {
        border-collapse: collapse;
        font-size: 12px;
        width: 100%;
        border: 1px solid #d4dadc;
    }
    .masterData-evidenceTable th {
        background: #e9eeef;
        color: #3e3efc;
        font-weight: normal;
        text-align: left;
        padding: 4px 8px;
    }
    .masterData-evidenceTable td {
        border-top: 1px solid #e3e8ea;
        padding: 3px 8px;
    }
    .masterData-option {
        display: flex;
        flex-direction: column;
        gap: 6px;
        text-align: left;
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid #d4dadc;
        background: #ffffff;
        cursor: pointer;
        font-family: Helvetica, sans-serif;
        font-size: 13px;
        color: #374649;
    }
    .masterData-option.masterData-selected {
        border: 2px solid #3e3efc;
        background: #eef0ff;
    }
    .masterData-optionTitle {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 14px;
        font-weight: bold;
    }
    .masterData-radio {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid #3e3efc;
        box-sizing: border-box;
        flex-shrink: 0;
        background: #ffffff;
    }
    .masterData-selected .masterData-radio {
        background: #3e3efc;
        box-shadow: inset 0 0 0 3px #ffffff;
    }
    .masterData-badge {
        font-size: 11px;
        font-weight: normal;
        color: #ffffff;
        background: #3e3efc;
        padding: 2px 8px;
        border-radius: 10px;
    }
    .masterData-probability {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: bold;
    }
    .masterData-probabilityBar {
        width: 90px;
        height: 6px;
        border-radius: 3px;
        background: #d4dadc;
        overflow: hidden;
    }
    .masterData-probabilityFill {
        height: 6px;
        background: #3e3efc;
    }
    .masterData-note {
        background: #f8f8f8;
        border: 1px dashed #b8c2c5;
        border-radius: 10px;
        padding: 8px 12px;
    }
    .masterData-footer {
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-top: 1px solid #d4dadc;
        padding-top: 12px;
    }
    .masterData-writtenLabel {
        color: #3e3efc;
        margin-right: 8px;
    }
    .masterData-applyButton {
        align-self: flex-end;
        font-size: 14px;
        font-weight: bold;
        border: none;
        border-radius: 14px;
        padding: 8px 24px;
        cursor: pointer;
        color: #ffffff;
        background: linear-gradient(to right, #009cea, #4139fd);
    }
    .masterData-applyButton:disabled {
        background: #b8c2c5;
        cursor: not-allowed;
    }
    /* what the data shows of a column, measured in the database */
    .masterData-evidenceText {
        font-size: 12px;
        color: #6b7a7d;
        white-space: pre-line;
    }
    /* Undo the choice beside Apply, at the end of the card */
    .masterData-footerButtons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
    }
    /* the tabs of the workflow steps, above the graph */
    .aiMappingWorkflow-tabs {
        display: flex;
        gap: 4px;
        padding: 6px 8px 0;
        border-bottom: 1px solid #d4dadc;
        font-family: Helvetica, sans-serif;
    }
    .aiMappingWorkflow-tab {
        border: 1px solid #d4dadc;
        border-bottom: none;
        border-radius: 10px 10px 0 0;
        padding: 5px 14px;
        background: #e9eeef;
        color: #374649;
        font-size: 13px;
        cursor: pointer;
    }
    .aiMappingWorkflow-tab.aiMappingWorkflow-selectedTab {
        background: #ffffff;
        color: #3e3efc;
        font-weight: bold;
    }
    .aiMappingWorkflow-tab:disabled {
        color: #b8c2c5;
        cursor: not-allowed;
    }
</style>
<div id="aiMappingWorkflow_leftPanel">
    <div class="masterData-databaseBar">
        <span class="masterData-databaseName" id="aiMappingWorkflow_databaseName"></span>
        <button class="slsv-button-1" id="aiMappingWorkflow_changeDatabaseButton">Change database</button>
        <button class="slsv-button-1" id="aiMappingWorkflow_deleteAllButton" title="Delete everything the AI found and decided on this database, and start again from scratch">Delete all</button>
    </div>
    <div class="masterData-databaseList" id="aiMappingWorkflow_databaseList"></div>
    <div id="aiMappingWorkflow_explanation"></div>
    <div id="aiMappingWorkflow_card"></div>
</div>
